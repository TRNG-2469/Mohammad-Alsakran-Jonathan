<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign In</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- Nav -->
        <nav>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register one</a>.</p>
        </nav>
        <main id="main" class="auth-main">
            <!-- Title -->
            <div class="auth-head">
                <h1>Sign in</h1>
                <p>Enter your username and password to file or review reimbursements.</p>
            </div>

            <!-- error message -->
            <p class="form-status is-error" hidden>That username or password isn't right.</p>

            <!-- Username -->
            <form class="form-card" action="/login" method="post" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <!-- Submit -->
                <div class="form-footer">
                    <span></span>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </div>
            </form>
        </main>
    </body>
</html>
<!-- Once Submit button is pressed, Username and password should be checked against the Users Table. If the combination
 of username and password is found, redirect the user to reimbursements.html. If the combination of
username and password does not exist, it should return "That username or password isn't right." and should not redirect the user.
-->
