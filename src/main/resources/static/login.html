<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign In</title>
        <link rel="stylesheet" href="styles.css">
        <script src="app.js" defer></script>
    </head>
    <body>
        <!-- Nav to register-->
        <nav>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register one</a>.</p>
        </nav>
        <main id="main" class="auth-main">
            <!-- Title -->
            <div class="auth-head">
                <h1>Sign in</h1>
                <p>Enter your username and password to file or review reimbursements.</p>
            </div>

            <!-- error message -->
            <p class="form-status is-error"  id="login-error" hidden>That username or password isn't right.</p>

            <!-- Form -->
            <form class="form-card" id="login-form" action="#" method="post" novalidate>
                <!-- Username -->
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <!-- Submit -->
                <div class="form-footer">
                    <span></span>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </div>
            </form>
        </main>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // If already logged in, go straight to the main app
                if (getCurrentUser()) {
                    window.location.href = 'reimbursements.html';
                    return;
                }

                const form = document.getElementById('login-form');
                const errorEl = document.getElementById('login-error');

                // Handle sign-in form submission
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    errorEl.hidden = true;

                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;

                    // Require both fields before attempting login
                    if (!username || !password) {
                        errorEl.hidden = false;
                        return;
                    }

                    // Send credentials via HTTP Basic Auth header
                    try {
                        // POST /api/login — backend checks Users table (UsersServiceImpl.logIn)
                        const result = await api('/login', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Basic ' + btoa(username + ':' + password) //~~~~~~~~~btoa() is the browsers built in base64 encoder, which is required by Basic Auth (username:password encoded to base64 in the header)
                            }
                        });

                        if (result.ok && result.body) {
                            // Success: store user (password already stripped by backend) and redirect
                            setCurrentUser(result.body);
                            window.location.href = 'reimbursements.html';
                        } else {
                            // 401 or other failure — show the exact message required by the comment
                            errorEl.hidden = false;
                        }
                    } catch (err) {
                        console.error(err);
                        errorEl.hidden = false;
                    }
                });
            });
        </script>
    </body>
</html>
<!-- Once Submit button is pressed, Username and password should be checked against the Users Table. If the combination
 of username and password is found, redirect the user to reimbursements.html. If the combination of
username and password does not exist, it should return "That username or password isn't right." and should not redirect the user.
-->
