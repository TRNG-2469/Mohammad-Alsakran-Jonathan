<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Approvals</title>
        <link rel="stylesheet" href="styles.css">
        <script src="app.js" defer></script>
    </head>
    <body>

    <!--Navigate to tabs -->
        <nav class="tabs" aria-label="Sections">
            <a class="tab" href="reimbursements.html" aria-current="page">New request</a>
            <a class="tab" href="my-requests.html">My requests</a>
            <a class="tab" href="approvals.html">Approvals</a>

            <div class="whoami">
                <div class="whoami-text">
                    <span class="whoami-name" id="whoami-name"></span>
                    <span class="whoami-dept" id="whoami-dept"></span>
                </div>
                <button type="button" class="btn" id="logout-btn">Log out</button>
            </div>
        </nav>

    <!-- Title -->
        <main id="main">
            <section class="panel">
                <div class="panel-head">
                    <h1>Approvals</h1>
                    <p class="panel-sub">Requests waiting on your decision, across your team.</p>
                    <div class="filter-bar">
                        <div class="field">
                            <label for="status-filter">Status</label>
                            <select id="status-filter">
                                <option value="PENDING" selected>Pending</option>
                                <option value="APPROVED">Approved</option>
                                <option value="DENIED">Denied</option>
                                <option value="ALL">All statuses</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="department-filter">Department</label>
                            <select id="department-filter">
                                <option value="ALL" selected>All departments</option>
                                <!-- populated by JS -->
                            </select>
                        </div>
                    </div>
                </div>

                <div class="receipt-list" id="approvals-list">
                    <!-- filled by JS -->
                </div>
            </section>
        </main>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            if (!(await requireAuth())) return;

            // Managers only
            if (!isManager()) {
                window.location.href = 'reimbursements.html';
                return;
            }
            updateApprovalsNav();
            renderWhoAmI();
            document.getElementById('logout-btn').addEventListener('click', logOut);

            const listEl = document.getElementById('approvals-list');
            const statusFilter = document.getElementById('status-filter');
            const departmentFilter = document.getElementById('department-filter');

            // author_id -> department_id, used when a filter can't be pushed down
            // to the backend (Reimbursement records don't carry department_id).
            let authorDeptMap = {};

            async function loadDepartmentOptions() {
                try {
                    const result = await api('/Departments');
                    if (result.ok && Array.isArray(result.body)) {
                        result.body.forEach(function (dept) {
                            const opt = document.createElement('option');
                            opt.value = dept.department_id != null ? dept.department_id : dept.id;
                            opt.textContent = dept.name;
                            departmentFilter.appendChild(opt);
                        });
                    }
                } catch (err) {
                    console.error('Failed to load departments', err);
                }
            }

            async function loadAuthorDeptMap() {
                try {
                    const result = await api('/Users');
                    if (result.ok && Array.isArray(result.body)) {
                        authorDeptMap = {};
                        result.body.forEach(function (u) {
                            authorDeptMap[u.user_id] = u.department_id;
                        });
                    }
                } catch (err) {
                    console.error('Failed to load users for department filtering', err);
                }
            }

            function renderItems(items) {
                listEl.innerHTML = '';

                if (items.length === 0) {
                    showEmptyState(listEl, 'No requests match that filter.');
                    return;
                }

                items = items.slice().sort(function (a, b) {
                    return b.reimbursements_id - a.reimbursements_id;
                });

                items.forEach(function (reimb) {
                    const status = (reimb.status || '').toUpperCase();
                    // Accept/Deny only make sense on PENDING requests.
                    listEl.appendChild(buildReceiptCard(reimb, status === 'PENDING'));
                });
            }

            async function loadItems() {
                listEl.innerHTML = '';
                const status = statusFilter.value;
                const departmentId = departmentFilter.value;

                try {
                    let items = [];

                    if (status !== 'ALL' && departmentId !== 'ALL') {
                        // Both filters map directly onto the backend endpoint.
                        const result = await api('/Reimbursements/filter?status=' + status + '&department_id=' + departmentId);
                        if (result.ok && Array.isArray(result.body)) {
                            items = result.body;
                        }
                    } else {
                        // "All statuses" and/or "All departments" — the backend
                        // filter endpoint can't express that, so pull everything
                        // and filter client-side.
                        const result = await api('/Reimbursements');
                        if (result.ok && Array.isArray(result.body)) {
                            items = result.body.filter(function (r) {
                                const statusMatches = status === 'ALL' || (r.status || '').toUpperCase() === status;
                                const deptMatches = departmentId === 'ALL' || String(authorDeptMap[r.author_id]) === departmentId;
                                return statusMatches && deptMatches;
                            });
                        }
                    }

                    renderItems(items);
                } catch (err) {
                    console.error(err);
                    showEmptyState(listEl, 'Could not load requests.');
                }
            }

            // Delegate Accept / Deny clicks
            listEl.addEventListener('click', async function (e) {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;

                const id = btn.dataset.id;
                const action = btn.dataset.action; // 'accept' | 'deny'
                const newStatus = action === 'accept' ? 'APPROVED' : 'DENIED';
                const user = getCurrentUser();

                const card = btn.closest('.receipt-card');
                card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });

                try {
                    const result = await api('/Reimbursements/' + id + '/resolve', {
                        method: 'PUT',
                        body: JSON.stringify({
                            status: newStatus,
                            resolver_id: user.user_id
                        })
                    });

                    if (result.ok) {
                        // Reload the current filtered view — a resolved item may
                        // no longer belong in it.
                        await loadItems();
                    } else {
                        card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
                        alert('Could not update request.');
                    }
                } catch (err) {
                    console.error(err);
                    card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
                    alert('Could not update request.');
                }
            });

            statusFilter.addEventListener('change', loadItems);
            departmentFilter.addEventListener('change', loadItems);

            await loadDepartmentOptions();
            await loadAuthorDeptMap();
            await loadItems();
        });
    </script>
    </body>
</html>
