<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approvals</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

<!--Navigate to tabs -->
<nav class="tabs" aria-label="Sections">
    <a class="tab" href="reimbursements.html" aria-current="page">New request</a>
    <a class="tab" href="my-requests.html">My requests</a>
    <a class="tab" href="approvals.html">Approvals</a>

    <div class="whoami">
        <div class="whoami-text">
            <span class="whoami-name" id="whoami-name"></span>
            <span class="whoami-dept" id="whoami-dept"></span>
        </div>
        <button type="button" class="btn btn-logout" id="logout-btn">Log out</button>
    </div>
</nav>

<!-- Title -->
<main id="main">
    <section class="panel">
        <div class="panel-head">
            <h1>Approvals</h1>
            <p class="panel-sub">Requests waiting on your decision, across your team.</p>
        </div>

        <div class="view-toggle">
            <button type="button" class="btn tab-toggle active" data-view="pending">Pending</button>
            <button type="button" class="btn tab-toggle" data-view="history">History</button>
        </div>

        <div class="receipt-list" id="approvals-list">
            <!-- filled by JS -->
        </div>
    </section>

    <section class="panel" style="margin-top: 32px;">
        <div class="panel-head">
            <h1>Promote to manager</h1>
            <p class="panel-sub">Give an employee manager access.</p>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="promote-user-select">Employee</label>
                <select id="promote-user-select"></select>
            </div>
            <div class="field" style="justify-content: flex-end;">
                <button type="button" class="btn btn-primary" id="promote-btn">Promote</button>
            </div>
        </div>
        <p class="edit-error" id="promote-status" hidden></p>
    </section>
</main>
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        if (!(await requireAuth())) return;

        // Managers only
        if (!isManager()) {
            window.location.href = 'reimbursements.html';
            return;
        }
        updateApprovalsNav();
        renderWhoAmI();
        document.getElementById('logout-btn').addEventListener('click', logOut);

        const listEl = document.getElementById('approvals-list');
        const toggleBtns = document.querySelectorAll('.tab-toggle');

        async function loadByStatuses(statuses) {
            listEl.innerHTML = '';
            try {
                // Fetching all and filtering client-side rather than using
                // /Reimbursements/filter, since that endpoint requires a specific
                // department_id and this view needs to show requests across all
                // departments, filtered only by status.
                let items = [];
                const result = await api('/Reimbursements');
                if (result.ok && Array.isArray(result.body)) {
                    items = result.body.filter(function (r) {
                        return statuses.indexOf((r.status || '').toUpperCase()) !== -1;
                    });
                }

                if (items.length === 0) {
                    showEmptyState(listEl, statuses.indexOf('PENDING') !== -1
                        ? 'No pending requests right now.'
                        : 'No resolved requests yet.');
                    return;
                }

                // Newest first, by id descending
                items = items.slice().sort(function (a, b) {
                    return (b.reimbursements_id || 0) - (a.reimbursements_id || 0);
                });

                items.forEach(function (reimb) {
                    const isPending = (reimb.status || '').toUpperCase() === 'PENDING';
                    listEl.appendChild(buildReceiptCard(reimb, isPending, false));
                });
            } catch (err) {
                console.error(err);
                showEmptyState(listEl, 'Could not load requests.');
            }
        }

        toggleBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                toggleBtns.forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                if (btn.dataset.view === 'pending') {
                    loadByStatuses(['PENDING']);
                } else {
                    loadByStatuses(['APPROVED', 'DENIED']);
                }
            });
        });

        // Delegate Accept / Deny clicks (only present on pending cards)
        listEl.addEventListener('click', async function (e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;

            const id = btn.dataset.id;
            const action = btn.dataset.action; // 'accept' | 'deny'
            const newStatus = action === 'accept' ? 'APPROVED' : 'DENIED';
            const user = getCurrentUser();

            // Disable buttons while resolving
            const card = btn.closest('.receipt-card');
            card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });

            try {
                // Backend route: PUT /api/Reimbursements/{id}/resolve
                // resolver_id is derived server-side from the session, sending it
                // here is harmless but ignored by the backend
                const result = await api('/Reimbursements/' + id + '/resolve', {
                    method: 'PUT',
                    body: JSON.stringify({
                        status: newStatus,
                        resolver_id: user.user_id
                    })
                });

                if (result.ok) {
                    // Remove the card from the pending list
                    card.remove();
                    if (!listEl.querySelector('.receipt-card')) {
                        showEmptyState(listEl, 'No pending requests right now.');
                    }
                } else {
                    // Re-enable on failure
                    card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
                    alert('Could not update request.');
                }
            } catch (err) {
                console.error(err);
                card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
                alert('Could not update request.');
            }
        });

        // ---------- Promote to manager ----------
        const promoteSelect = document.getElementById('promote-user-select');
        const promoteBtn = document.getElementById('promote-btn');
        const promoteStatus = document.getElementById('promote-status');

        async function loadEmployees() {
            const result = await api('/Users');
            promoteSelect.innerHTML = '';
            if (result.ok && Array.isArray(result.body)) {
                const employees = result.body.filter(function (u) { return u.role === false; });
                if (employees.length === 0) {
                    const opt = document.createElement('option');
                    opt.textContent = 'No employees to promote';
                    opt.disabled = true;
                    promoteSelect.appendChild(opt);
                    promoteBtn.disabled = true;
                    return;
                }
                promoteBtn.disabled = false;
                employees.forEach(function (u) {
                    const opt = document.createElement('option');
                    opt.value = u.user_id;
                    opt.textContent = u.first_name + ' ' + u.last_name + ' (' + u.username + ')';
                    promoteSelect.appendChild(opt);
                });
            }
        }

        promoteBtn.addEventListener('click', async function () {
            const userId = promoteSelect.value;
            if (!userId) return;
            promoteStatus.hidden = true;
            promoteBtn.disabled = true;

            try {
                const result = await api('/Users/' + userId + '/role', {
                    method: 'PUT',
                    body: JSON.stringify({ role: true })
                });

                if (result.ok) {
                    promoteStatus.textContent = 'Promoted successfully.';
                    promoteStatus.style.color = 'var(--green)';
                    promoteStatus.hidden = false;
                    await loadEmployees();
                } else {
                    promoteStatus.style.color = 'var(--red)';
                    promoteStatus.textContent = 'Could not promote user.';
                    promoteStatus.hidden = false;
                }
            } catch (err) {
                console.error(err);
                promoteStatus.style.color = 'var(--red)';
                promoteStatus.textContent = 'Could not promote user.';
                promoteStatus.hidden = false;
            } finally {
                promoteBtn.disabled = false;
            }
        });

        await loadEmployees();
        await loadByStatuses(['PENDING']);
    });
</script>
</body>
</html>
<!-- 1. Make it so the approvals.html link (line 15) is only accessible if the current user is a manager (role = true)
2. Finish the implementation. Display every record in Reimbursements where status is 'PENDING'. below each record
have 2 buttons, 'deny' and 'accept'. after either button is pushed change the status to either 'APPROVED' or 'DENIED' based on which button was
pressed
3. Added a Pending/History toggle so managers can view resolved (APPROVED/DENIED) requests too.
4. Added a Promote to Manager section, lets a manager promote any employee via PUT /api/Users/{id}/role. -->
