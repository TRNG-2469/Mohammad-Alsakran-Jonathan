<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reimbursements</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

<!--Navigate to tabs -->
<nav class="tabs" aria-label="Sections">
    <a class="tab" href="reimbursements.html" aria-current="page">New request</a>
    <a class="tab" href="my-requests.html">My requests</a>
    <a class="tab" href="approvals.html">Approvals</a>

    <div class="whoami">
        <div class="whoami-text">
            <span class="whoami-name" id="whoami-name"></span>
            <span class="whoami-dept" id="whoami-dept"></span>
        </div>
        <button type="button" class="btn btn-logout" id="logout-btn">Log out</button>
    </div>
</nav>

<!-- Title -->
<main id="main">
    <section class="panel">
        <div class="panel-head">
            <h1>My requests</h1>
            <p class="panel-sub">Every reimbursement you've filed, newest first.</p>
            <div class="filter-bar">
                <div class="field">
                    <label for="status-filter">Status</label>
                    <select id="status-filter">
                        <option value="ALL" selected>All statuses</option>
                        <option value="PENDING">Pending</option>
                        <option value="APPROVED">Approved</option>
                        <option value="DENIED">Denied</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="receipt-list" id="my-requests-list">
            <!-- filled by JS -->
        </div>
    </section>
</main>
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        // Verify session, set up nav/user display, and wire the logout button
        if (!(await requireAuth())) return;
        updateApprovalsNav();
        renderWhoAmI();
        document.getElementById('logout-btn').addEventListener('click', logOut);

        const listEl = document.getElementById('my-requests-list');
        const statusFilter = document.getElementById('status-filter');
        const user = getCurrentUser();

        // Enable inline editing of PENDING requests
        wireEditHandlers(listEl, user);

        // Holds every request loaded from the server (unfiltered)
        let allItems = [];

        // Re-render the list based on the currently selected status filter
        function render() {
            const selected = statusFilter.value;
            const items = selected === 'ALL'
                ? allItems
                : allItems.filter(function (r) {
                    return (r.status || '').toUpperCase() === selected;
                });

            listEl.innerHTML = '';

            if (items.length === 0) {
                showEmptyState(listEl, selected === 'ALL'
                    ? 'You have not filed any reimbursements yet.'
                    : 'No requests with that status.');
                return;
            }

            items.forEach(function (reimb) {
                listEl.appendChild(buildReceiptCard(reimb, false, true));
            });
        }

        // Load all of the current user's reimbursements, newest first
        try {
            // Backend route: GET /api/Reimbursements/author/{id}
            const result = await api('/Reimbursements/author/' + user.user_id);

            if (!result.ok || !Array.isArray(result.body)) {
                showEmptyState(listEl, 'Could not load your requests.');
                return;
            }

            // Newest first, by reimbursements_id descending
            allItems = result.body.slice().sort(function (a, b) {
                return b.reimbursements_id - a.reimbursements_id;
            });

            render();
        } catch (err) {
            console.error(err);
            showEmptyState(listEl, 'Could not load your requests.');
        }

        // Re-render whenever the status filter changes
        statusFilter.addEventListener('change', render);
    });
</script>
</body>
</html>
